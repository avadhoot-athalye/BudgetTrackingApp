spring.application.name=budget-tracker

# PostgreSQL datasource (adjust database name, username, password as needed)
spring.datasource.url=jdbc:postgresql://localhost:5432/BudgetTrackerApp
spring.datasource.username=postgres
spring.datasource.password=admin
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# HikariCP (optional tuning)
spring.datasource.hikari.maximum-pool-size=10