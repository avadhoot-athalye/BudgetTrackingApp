<div class="budgeting-container">
  <!-- Page Header -->
  <div class="page-header mb-4">
    <h1 class="page-title">
      <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="me-2" viewBox="0 0 16 16" style="display: inline;">
        <path d="M1 3a1 1 0 0 1 1-1h12a1 1 0 0 1 1 1H1zm7 8a2 2 0 1 0 0-4 2 2 0 0 0 0 4z"/>
      </svg>
      Budget Management
    </h1>
    <p class="page-subtitle">Create and manage your budget allocations</p>
  </div>

  <div class="row g-4">
    <!-- Left: Form -->
    <div class="col-lg-6">
      <div class="form-card card shadow-sm h-100">
        <div class="card-header bg-gradient">
          <h5 class="card-title mb-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="me-2" viewBox="0 0 16 16" style="display: inline;">
              <path d="M12.146.292a.5.5 0 0 1 .638.057l2.025 2.025a.5.5 0 0 1-.057.638l-10.5 10.5a.5.5 0 0 1-.114.112l-3 3a.5.5 0 0 1-.707-.707l2.646-2.646-1.414-1.414-2.646 2.646a.5.5 0 0 1-.707-.707l3-3a.5.5 0 0 1 .112-.114l10.5-10.5z"/>
            </svg>
            Add New Budget
          </h5>
        </div>
        <div class="card-body">
          <form (ngSubmit)="onSubmit()" class="needs-validation" novalidate>
            <div *ngIf="successMessage" class="alert alert-success alert-dismissible fade show" role="alert">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16" style="display: inline;">
                <path d="M16 8A8 8 0 1 1 0 8a8 8 0 0 1 16 0zm-3.97-3.03a.75.75 0 0 0-1.08.022L7.477 9.417 5.384 7.323a.75.75 0 0 0-1.06 1.061L6.97 11.03a.75.75 0 0 0 1.079-.02l3.992-4.99a.75.75 0 0 0-.01-1.05z"/>
              </svg>
              {{ successMessage }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>
            <div *ngIf="errorMessage" class="alert alert-danger alert-dismissible fade show" role="alert">
              <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16" style="display: inline;">
                <path d="M8 15A7 7 0 1 1 8 1a7 7 0 0 1 0 14zm0 1A8 8 0 1 0 8 0a8 8 0 0 0 0 16z"/>
              </svg>
              {{ errorMessage }}
              <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            </div>

            <div class="mb-3">
              <label for="expenseHead" class="form-label fw-600">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-1" viewBox="0 0 16 16" style="display: inline;">
                  <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2z"/>
                </svg>
                Expense Head
              </label>
              <select
                id="expenseHead"
                class="form-select form-select-custom"
                [(ngModel)]="model.expenseHeadId"
                name="expenseHeadId"
                required
              >
                <option [ngValue]="null" disabled>Select an expense head</option>
                <option *ngFor="let h of expenseHeads" [ngValue]="h.id">{{ h.name }}</option>
              </select>
            </div>

            <div class="mb-3">
              <label for="allocatedAmount" class="form-label fw-600">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-1" viewBox="0 0 16 16" style="display: inline;">
                  <path d="M8 1a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM3 4.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0z"/>
                </svg>
                Allocated Amount
              </label>
              <div class="input-group">
                <span class="input-group-text">₹</span>
                <input
                  id="allocatedAmount"
                  type="number"
                  class="form-control form-control-custom"
                  [(ngModel)]="model.allocatedAmount"
                  name="allocatedAmount"
                  min="0"
                  placeholder="0.00"
                  required
                />
              </div>
            </div>

            <div class="d-grid gap-2">
              <button type="submit" class="btn btn-primary btn-lg btn-custom">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="me-2" viewBox="0 0 16 16" style="display: inline;">
                  <path d="M12.146.292a.5.5 0 0 1 .638.057l2.025 2.025a.5.5 0 0 1-.057.638l-10.5 10.5a.5.5 0 0 1-.114.112l-3 3a.5.5 0 0 1-.707-.707l2.646-2.646-1.414-1.414-2.646 2.646a.5.5 0 0 1-.707-.707l3-3a.5.5 0 0 1 .112-.114l10.5-10.5z"/>
                </svg>
                Save Budget
              </button>
            </div>
          </form>
        </div>
      </div>
    </div>

    <!-- Right: Budgets table -->
    <div class="col-lg-6">
      <div class="table-card card shadow-sm h-100">
        <div class="card-header bg-gradient">
          <h5 class="card-title mb-0">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" class="me-2" viewBox="0 0 16 16" style="display: inline;">
              <path d="M0 3a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H2a2 2 0 0 1-2-2V3zm2-1a1 1 0 0 0-1 1v10a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V3a1 1 0 0 0-1-1H2z"/>
            </svg>
            Existing Budgets
          </h5>
        </div>
        <div class="card-body">
          <div class="table-responsive">
            <table class="table table-hover table-custom">
              <thead>
                <tr>
                  <th>
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16" style="display: inline;">
                      <path d="M3 2.5a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0zm5 0a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0zm8 1a2 2 0 1 0-4 0 2 2 0 0 0 4 0z"/>
                    </svg>
                    Expense Head
                  </th>
                  <th class="text-end">
                    <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="currentColor" class="me-2" viewBox="0 0 16 16" style="display: inline;">
                      <path d="M8 1a2 2 0 1 1 0 4 2 2 0 0 1 0-4zM3 4.5a.5.5 0 1 1-1 0 .5.5 0 0 1 1 0z"/>
                    </svg>
                    Allocation Amount
                  </th>
                </tr>
              </thead>
              <tbody>
                <tr *ngFor="let b of budgets; let i = index" class="table-row-hover">
                  <td class="fw-500">{{ b.expenseHead }}</td>
                  <td class="text-end fw-600 text-primary">{{ b.allocatedAmount | currency: 'INR' }}</td>
                </tr>
              </tbody>
            </table>
            <div *ngIf="budgets.length === 0" class="text-center py-4 text-muted">
              <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" fill="currentColor" class="mb-2 opacity-50" viewBox="0 0 16 16" style="display: block;">
                <path d="M8 1a2 2 0 0 1 2 2v4H6V3a2 2 0 0 1 2-2zm3 6V3a3 3 0 0 0-6 0v4a2 2 0 0 0-2 2v5a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2v-5a2 2 0 0 0-2-2z"/>
              </svg>
              <p>No budgets created yet. Add one to get started!</p>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
